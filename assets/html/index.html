    ###USERSTATUS###

    <!--
        Kopfleiste. Eine Zeile fuer die ganze Anwendung.

        In der Leiste stehen nur noch die Aktionen, die man haeufig braucht:
        einen Standort anbieten und die Standortliste. Alles, was das eigene
        Konto betrifft - Konto, Benutzerliste, Chats, Abmelden -, liegt im
        Menue hinter dem Benutzernamen. Fuenf gleichrangige Knoepfe
        nebeneinander waren Adminpanel-Optik.

        Die IDs location-button und browse-locations-button werden von
        assets/js/ui.js gefuellt - sie muessen erhalten bleiben. Das Menue
        selbst baut App\Helper\ViewHelper::userMenu(), weil es den
        Benutzernamen enthaelt.

        In diesem Kommentar steht bewusst KEIN Platzhaltername ausgeschrieben:
        ViewHelper ersetzt mit str_replace jedes Vorkommen im Dokument, auch
        eines in einem Kommentar.
    -->
    <header class="app-topbar">
        <!-- Name und Zeichen der Anwendung stehen an genau dieser Stelle.
             Steht ein Produktname fest, wird er hier eingetragen - und nur
             hier. -->
        <a class="app-topbar__brand" href="index.php?act=home">
            <span class="app-topbar__mark" aria-hidden="true">W</span>
            <span>WebRTC-App</span>
        </a>

        <span class="app-topbar__spacer"></span>

        <!-- Die Seitenaktionen. Auf schmalen Geraeten schiebbar. -->
        <div class="app-topbar__actions">
            <div id="location-button"></div>
            <div id="browse-locations-button"></div>
        </div>

        <!-- Das Konto steht ausserhalb der schiebbaren Zeile: Es muss immer
             erreichbar sein, auch auf einem schmalen Geraet - dahinter liegt
             das Abmelden.

             Davor der Bereitschaftsschalter des Guides. Er steht aus demselben
             Grund hier und nicht in der schiebbaren Aktionszeile daneben: Ob
             man gerade anrufbar ist, darf auf keinem Geraet aus dem Blick
             geraten. Gebaut wird er von App\Helper\ViewHelper; wer keine
             Standorte anbietet, bekommt an dieser Stelle nichts. -->
        <div class="app-topbar__account">
            ###AVAILABILITY###
            ###USER###
            ###REGISTER###
            ###LOGOUT###
        </div>
    </header>

    <main id="app-main" class="app-main">
        <div id="admin-panel" class="app-page">
            ###CONTENT###
        </div>
    </main>

    <!--
        Fusszeile. Auf jeder Seite dieselbe.
