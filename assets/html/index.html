<!DOCTYPE html>
<html lang="###LANG###" data-theme="###THEME###">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>###BRAND###</title>

    <!-- Farbprofil setzen, BEVOR die Stilvorlagen greifen. Der Inhalt kommt
         aus App\Helper\Theme::bootScript(); dort steht auch, warum das
         Skript ausnahmsweise im Dokument steht und nicht in einer Datei. -->
    ###THEME_BOOT###

    <!-- Sprache und Katalog fuer das JavaScript. Der Inhalt kommt aus
         App\Helper\I18n::bootScript(); im <head>, damit ein Modul, das beim
         Laden schon etwas meldet, den Text bereits vorfindet.

         DER TEXT DER SEITE HAENGT NICHT DARAN - den setzt der Server beim
         Bauen ein. Hier stehen die Saetze, die erst durch ein Ereignis
         entstehen: "Anruf abgelehnt", "Datei zu gross", "Nicht
         gespeichert". -->
    ###I18N_BOOT###

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- CSS-Bibliotheken -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Eigene Gestaltung.
         theme.css steht VOR den uebrigen eigenen Dateien: Dort liegen die
         Variablen (Farben, Abstaende, Schrift) und die Anbindung an
         Bootstrap. Alles Weitere benutzt nur noch diese Variablen. -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/call.css">
    <link rel="stylesheet" href="assets/css/map.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <link rel="stylesheet" href="assets/css/location.css">
    <!-- Der Guide als Mensch: Profilseite, der Streifen auf der Standortseite
         und das Formular auf der Kontoseite. Nach location.css, weil der
         Streifen dort im Inhaltsbereich steht und dessen Umgebung kennt. -->
    <link rel="stylesheet" href="assets/css/guide.css">
    <!-- Bewertungen: der Block auf Standortseite und Guide-Profil und die
         Karte, mit der nach dem Auflegen gefragt wird. Nach guide.css, weil
         der Block auf beiden Seiten in deren Umgebung steht. -->
    <link rel="stylesheet" href="assets/css/review.css">
    <!-- Die laufende Fuehrung: der Hinweis an den Guide, dass sie noch nicht
         beendet ist. Nach review.css, weil beide Karten dieselbe Flaeche
         benutzen (.app-ask in theme.css). -->
    <link rel="stylesheet" href="assets/css/tour.css">
    <!-- Die Landingpage. Sie benutzt dieselben Variablen wie alles andere -
         eigene Farbwerte stehen dort keine. Nach tour.css und vor admin.css,
         weil sie zur Kundenoberflaeche gehoert; wirksam wird sie nur unter
         .lp, also nur auf dieser einen Seite. -->
    <link rel="stylesheet" href="assets/css/landing.css">
    <!-- Der Verwaltungsbereich. Als LETZTE eigene Datei, weil er die
         Bausteine der uebrigen enger setzt und dafuer das letzte Wort haben
         muss. Wirksam wird sie nur unter .adm - also nur auf den Seiten des
         Bereichs (App\Helper\AdminView). -->
    <link rel="stylesheet" href="assets/css/admin.css">

    <!-- JS-Bibliotheken -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-pip@latest/leaflet-pip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.4.1/css/responsive.dataTables.min.css" />
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>


    <!-- ... eigene JS-Module ... -->
    <script src="assets/js/app.js"></script>
    <!-- Die Kartenkacheln. Vor allen Modulen, die eine Karte bauen
         (locations_table.js, map.js, home_map.js, location_page.js) - dort
         steht die Adresse nicht mehr, sie kommt von hier. -->
    <script src="assets/js/map_tiles.js"></script>
    <!-- Die Texte. VOR notify.js und damit vor allem, was eine Meldung
         ausgeben kann - ein Modul, das seinen Satz nicht findet, zeigt den
         Schluessel an (assets/js/i18n.js). -->
    <script src="assets/js/i18n.js"></script>
    <!-- Meldungen und Rueckfragen. Frueh geladen, weil fast jedes andere
         Modul darauf zurueckgreift. -->
    <script src="assets/js/notify.js"></script>
    <script src="assets/js/theme_switch.js"></script>
    <script src="assets/js/protocol.js"></script>
    <script src="assets/js/sound.js"></script>
    <script src="assets/js/rtc.js"></script>
    <script src="assets/js/control.js"></script>
    <!-- Lokale Medien (Mikrofon, Kamera, Geraetewechsel). Nach rtc.js und
         control.js, weil es beide zur Laufzeit benutzt. -->
    <script src="assets/js/media.js"></script>
    <script src="assets/js/signaling.js"></script>
    <script src="assets/js/chat.js"></script>

    <script src="assets/js/chat_manager.js"></script>
    <script src="assets/js/ui_chat.js"></script>
    <script src="assets/js/ui_rtc.js"></script>

    <script src="assets/js/ui.js"></script>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>
    <!-- Der Bereitschaftsschalter der Kopfleiste. Nach main.js, weil er sich
         in dessen Heartbeat einhaengt. -->
    <script src="assets/js/availability.js"></script>
    <!-- Der Anfragenzaehler der Kopfleiste und die Anfragenseite. Nach
         main.js, weil er sich - wie der Bereitschaftsschalter - in dessen
         Heartbeat einhaengt. -->
    <script src="assets/js/requests.js"></script>
    <!-- Der Nachrichtenzaehler der Kopfleiste. Nach requests.js, weil beide
         dasselbe tun: Sie haengen sich in den Heartbeat aus main.js ein und
         zeichnen damit eine Zahl in der Leiste nach. Er braucht ausserdem
         ui_chat.js, dessen Fenster er beim Anklicken oeffnet. -->
    <script src="assets/js/chat_badge.js"></script>
    <!-- Die Frage nach der Fuehrung. Nach requests.js, weil beide sich in
         denselben Heartbeat einhaengen und weil die Anfragenliste die
         Sternreihe dieses Moduls benutzt. -->
    <script src="assets/js/review.js"></script>
    <!-- Das Gegenstueck beim Guide: wieder einsteigen oder beenden. Nach
         review.js, weil beide sich in denselben Heartbeat einhaengen und die
         Anfragenliste beide benutzt. -->
    <script src="assets/js/tour.js"></script>
    <script src="assets/js/locations_table.js"></script>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/home_map.js"></script>
    <!-- Die Seite eines einzelnen Standorts. Sie meldet sich nur, wenn der
         Server ihre Daten mitgeliefert hat - auf jeder anderen Seite tut
         dieses Modul nichts. -->
    <script src="assets/js/location_page.js"></script>
    <!-- Die Landingpage: die Karte im Blickfang und die Nadeln, die nach und
         nach darauf erscheinen. Nach map_tiles.js (die Kacheladresse kommt
         von dort) und nach home_map.js, damit die Reihenfolge der beiden
         Karten der Reihenfolge ihrer Stilvorlagen entspricht. Das Modul
         meldet sich nur, wenn seine Flaeche im Dokument steht. -->
    <script src="assets/js/landing.js"></script>
    <!-- Die Aktionen des Verwaltungsbereichs: sperren, freigeben, eine
         Bewertung entfernen. Sie standen vorher in locations_table.js und in
         review.js - also in Modulen der Kundenoberflaeche. Dieses hier haengt
         sich nur ein, wenn .adm im Dokument steht. -->
    <script src="assets/js/admin.js"></script>

</head>
<body>
    ###USERSTATUS###

    <!--
        Die Kopfleiste. ZWEI FASSUNGEN, eingesetzt von
        App\Helper\ViewHelper::output():

          assets/html/topbar.html       die Leiste der Anwendung - Aktionen,
                                        Zaehler, Bereitschaft, Kontomenue.
          assets/html/topbar_slim.html  die Leiste der Landingpage: Name,
                                        Anmelden, Registrieren, Sprache,
                                        Farbprofil. Sonst nichts.

        WARUM SIE NICHT MEHR HIER STEHT: Weil es zwei sind. Eine zweite
        Leiste als "wenn nicht Landingpage, dann"-Verzweigung mitten in
        dieser Datei waere ein Formular mit zwei Gesichtern; als eigene
        Vorlage ist jede fuer sich lesbar. Das Layout entscheidet nicht,
        welche gilt - es nennt nur die Stelle.
    -->
    ###TOPBAR###

    <main id="app-main" class="app-main">
        <!-- Der Inhaltsbereich. Er hiess bis zum Umbau id="admin-panel" -
             ein Name aus einer Zeit, in der die ganze Anwendung als Adminpanel
             gedacht war. Er trug ihn auf JEDER Seite, auch auf der Startseite
             und im Anmeldeformular. Die Verwaltung hat jetzt einen eigenen
             Bereich (App\Helper\AdminView), und dieser Behaelter heisst nach
             dem, was er ist. -->
        <div id="app-content" class="app-page">
            ###CONTENT###
        </div>
    </main>

    <!--
        Fusszeile. Auf jeder Seite dieselbe.

        DIE DREI VERWEISE ZEIGEN AUF SEITEN, DIE ES GIBT - sie sind nur noch
        leer. Vorher stand dort dreimal "#", und ein Verweis auf "#" fuehrt
        nirgendwohin: Der Browser springt an den Seitenanfang, und der
        Besucher haelt es fuer einen Fehler. Eine Seite, die sagt "hier fehlt
        noch der Text", ist eine Auskunft; ein toter Verweis ist keine.

        Gebaut werden die drei Seiten von
        App\Controller\SystemController::legalPage() aus einer gemeinsamen
        Vorlage (assets/html/legal.html).

        Der Name daneben kommt aus App\Helper\Brand - siehe die Kopfleiste.
    -->
    <footer class="app-footer">
        <!-- Name und der Weg zur Landingpage. Beides zusammen in einem
             Kasten, damit die Zeile drei Gruppen hat und nicht vier: Name
             und "Worum geht es hier" gehoeren zusammen, die Pflichtseiten
             sind etwas anderes.

             DER VERWEIS STEHT HIER UND NICHT IN DER KOPFLEISTE: Die
             Landingpage erklaert das Produkt, und das braucht, wer schon
             angemeldet ist, nicht staendig vor Augen. In der Fusszeile steht
             er auf jeder Seite und ist trotzdem niemandem im Weg. -->
        <span class="app-footer__brand">
            <span class="app-footer__mark">###BRAND###</span>
            <a class="app-footer__about" href="index.php?act=landing">{{t:fuss.ueber}}</a>
        </span>
        <nav class="app-footer__links" aria-label="{{t:fuss.rechtliches}}">
            <a href="index.php?act=imprint">{{t:fuss.impressum}}</a>
            <a href="index.php?act=privacy">{{t:fuss.datenschutz}}</a>
            <a href="index.php?act=contact">{{t:fuss.kontakt}}</a>
        </nav>
        <!-- Der Sprachumschalter - nur fuer Gaeste. Wer angemeldet ist,
             findet die Wahl auf der Kontoseite neben dem Farbprofil: Dort
             wird sie am Konto gespeichert und gilt auf jedem Geraet.
             Gebaut wird er von App\Helper\ViewHelper. -->
        ###LANGSWITCH###
    </footer>

    ###INNER_CALL_CONTROLL###
    ###CALL_CONTROLL###
    ###MEDIA###
</body>
</html>
