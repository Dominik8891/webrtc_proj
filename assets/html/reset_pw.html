<!--
    Neues Passwort setzen. Gefuellt von App\Controller\PasswordController.

    Platzhalter:
      ###TOKEN###          Der Link-Token aus der E-Mail
      ###PW_RESET_MSG###   Meldung; leer, wenn es keine gibt.
-->
<div class="app-auth">
    <div class="app-auth__card">
        <div class="app-panel">
            <div class="app-panel__body">
                <div class="app-auth__head">
                    <h1 class="app-auth__title">Neues Passwort setzen</h1>
                </div>

                <form action="index.php?act=reset_pw" method="post" autocomplete="off">
                    <input type="hidden" name="token" value="###TOKEN###">
                    <div class="app-field">
                        <label for="pwd1" class="form-label">Neues Passwort</label>
                        <input type="password" id="pwd1" name="pwd1" class="form-control" required>
                    </div>
                    <div class="app-field">
                        <label for="pwd2" class="form-label">Neues Passwort wiederholen</label>
                        <input type="password" id="pwd2" name="pwd2" class="form-control" required>
                    </div>
                    <div class="app-actions app-actions--stretch">
                        <button type="submit" class="btn btn-primary">Passwort ändern</button>
                    </div>
                </form>

                <div class="app-form-error">###PW_RESET_MSG###</div>
            </div>
        </div>
    </div>
</div>
