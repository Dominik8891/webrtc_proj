<!--
    Die Call-Ansicht. EINE Ansicht, ZWEI Oberflaechen.

    GRUNDGEDANKE
    ------------
    Guide und Zuschauer machen in diesem Gespraech nicht dasselbe, also sehen
    sie nicht dasselbe:

      Zuschauer  Er schaut zu und steuert. Das Bild des Guides fuellt den
                 Bildschirm, darauf liegen Steuerkreuz, Verbindungsstatus und
                 der Hinweis, wenn der Guide die Steuerung angehalten hat.

      Guide      Er BEKOMMT KEIN BILD - der Zuschauer sendet keins. Ein
                 Videobereich fuer ein Bild, das es nicht gibt, waere eine
                 schwarze Flaeche mitten in der Ansicht. Bei ihm zeigt die
                 Buehne stattdessen SEIN EIGENES Bild: Das ist zugleich seine
                 Kamerakontrolle - er sieht, ob die Kamera laeuft und was er
                 uebertraegt. Darauf liegen die grosse Richtungsanzeige und
                 der Sperrschalter.

    WARUM EIN MARKUP UND NICHT ZWEI VORLAGEN
    ----------------------------------------
    Jedes Bauteil steht GENAU EINMAL im Dokument. Die Rolle steht erst beim
    Verbindungsaufbau fest (der Server stempelt sie an das Offer, siehe
    WebRTCController::roleForCall) - zwei getrennte Vorlagen muessten also
    entweder beide im Dokument liegen (doppelte IDs, genau das ist dieses
    Projekt gerade erst losgeworden) oder zur Laufzeit nachgeladen werden.
    Stattdessen traegt #call-view die Klasse "role-guide" beziehungsweise
    "role-viewer" (gesetzt von assets/js/control.js), und
    assets/css/call.css entscheidet daran, was zu sehen ist und wo es liegt.

    GEMEINSAM      Kopfbereich (Name, Verbindungsstatus, Auflegen),
                   Bedienleiste (Mikrofon, Kamera, Geraete, Chat),
                   Geraeteblatt, Chatblatt.
    NUR GUIDE      Buehne = eigenes Bild, Richtungsanzeige, Sperrschalter.
    NUR ZUSCHAUER  Buehne = Bild des Guides, Steuerkreuz, Sperrhinweis,
                   eigenes Bild klein in der Ecke.
-->
<div id="call-view" style="display:none;">

    <!-- Die Buehne. Was hier zu sehen ist, entscheidet die Rolle. -->
    <div class="call-stage">

        <!-- ZUSCHAUER: das Bild des Guides. Beim Guide ausgeblendet. -->
        <video id="remote-video" class="call-video" autoplay playsinline></video>

        <!-- ZUSCHAUER: steht anstelle des Bildes, wenn der Guide die Kamera
             aus hat oder noch keins ankommt. Gesetzt von
             rtc.setRemoteVideoVisible() - aus der Nachricht video_state und
             aus dem Stummwerden der Empfangsspur. -->
        <div id="remote-video-placeholder" class="call-novideo" style="display:none;">
            <div class="call-novideo__mark" aria-hidden="true">&#128249;</div>
            <p class="call-novideo__text">Kein Videobild</p>
        </div>

        <!-- Das eigene Bild.
             Beim Zuschauer klein in der Ecke, beim Guide die ganze Buehne -
             siehe assets/css/call.css, Abschnitt "Rollen". -->
        <video id="local-video" class="call-self" autoplay muted playsinline></video>

        <!-- Steht anstelle des eigenen Bildes, solange die eigene Kamera aus
             ist. Beim Guide ist das keine Kleinigkeit: Bei ihm IST das eigene
             Bild die Buehne. Gesetzt von media.updateLocalPreview(). -->
        <div id="local-video-placeholder" class="call-self-off" style="display:none;">
            <div class="call-self-off__mark" aria-hidden="true">&#128247;</div>
            <p class="call-self-off__text">Kamera aus</p>
        </div>

        <!-- GUIDE: grosse Richtungsanzeige.
             Zweite Spur neben dem Ton: Der Guide laeuft und schaut nicht
             aufs Display - deshalb bildschirmfuellend, hoher Kontrast, ein
             Pfeil und ein Wort. Gesetzt von control.showDirection(). -->
        <div id="direction-indicator" class="direction-indicator" style="display:none;" aria-live="assertive">
            <span id="direction-indicator-arrow" class="direction-indicator__arrow"></span>
            <span id="direction-indicator-label" class="direction-indicator__label"></span>
        </div>
    </div>

    <!-- GEMEINSAM: Kopfbereich als Overlay. Der Verbindungsstatus steht in
         beiden Rollen an derselben Stelle - beide muessen wissen, woran sie
         sind. -->
    <div class="call-top">
        <div class="call-top__who">
            <span id="remote-username" class="call-top__name"></span>
            <!-- Verbindungsstatus: verbunden, instabil, Wiederverbindung,
                 getrennt. Gesetzt von rtc.setConnectionStatus(). -->
            <span id="connection-status" class="connection-status" style="display:none;"></span>
        </div>
        <button id="end-call-btn" type="button" class="btn btn-danger call-hangup">Auflegen</button>
    </div>

    <!-- ZUSCHAUER: Anzeige, dass der Guide die Steuerung angehalten hat.
         Gesetzt von control.updateLockUi(). -->
    <div id="control-lock-notice" class="control-lock-notice" style="display:none;" role="status">
        <span class="control-lock-notice__icon" aria-hidden="true"></span>
        <span class="control-lock-notice__text">Steuerung gesperrt – der Guide hat sie angehalten.</span>
    </div>

    <!-- ZUSCHAUER: das Steuerkreuz. Liegt ueber dem Bild, nicht daneben -
         es ist die Hauptbedienung dieser Rolle. -->
    <div id="control-pad" class="call-pad">
        <div class="arrow-controls">
            <button id="btn-forward"  type="button" class="call-arrow call-arrow--up"    aria-label="Vorwärts">&uarr;</button>
            <button id="btn-left"     type="button" class="call-arrow call-arrow--left"  aria-label="Nach links">&larr;</button>
            <button id="btn-right"    type="button" class="call-arrow call-arrow--right" aria-label="Nach rechts">&rarr;</button>
            <button id="btn-backward" type="button" class="call-arrow call-arrow--down"  aria-label="Rückwärts">&darr;</button>
        </div>
    </div>

    <!-- GUIDE: Sperrschalter, etwa beim Ueberqueren einer Strasse.
         Liegt im Videobild statt im Kopfbereich, weil der Guide das Geraet
         in der Hand haelt und der Daumen unten liegt. -->
    <div id="control-lock-bar" class="control-lock-bar" style="display:none;">
        <button id="control-lock-btn" type="button" class="btn btn-warning fw-bold control-lock-btn">Steuerung sperren</button>
    </div>

    <!-- GEMEINSAM: Bedienleiste unten. Die Kamerakontrolle steht in beiden
         Rollen hier - beim Guide, weil sein Bild die Uebertragung IST, beim
         Zuschauer, weil er sich zeigen darf, aber nicht muss. -->
    <div class="call-bar">
        <button id="switch-mic-btn" type="button" class="call-btn" title="Mikrofon an/aus">
            <img id="mic-icon" src="assets/img/mic.png" alt="Mikrofon">
        </button>
        <button id="switch-cam-btn" type="button" class="call-btn" title="Kamera an/aus">
            <img id="cam-icon" src="assets/img/camera.png" alt="Kamera">
        </button>
        <button id="call-devices-btn" type="button" class="call-btn call-btn--text" aria-expanded="false">Geräte</button>
        <button id="chat-toggle-btn" type="button" class="call-btn call-btn--text" aria-expanded="false">Chat</button>
    </div>

    <!-- GEMEINSAM: Geraeteauswahl. Aufklappbar statt dauerhaft sichtbar.
         Ein Wechsel wirkt sofort - er laeuft ueber replaceTrack und braucht
         keine Neuaushandlung (assets/js/media.js). -->
    <div id="call-devices" class="call-sheet" hidden>
        <div class="call-sheet__row">
            <label for="camera-select-in-call" class="call-sheet__label">Kamera</label>
            <select id="camera-select-in-call" class="form-select form-select-sm"></select>
        </div>
        <div class="call-sheet__row">
            <label for="mic-select-in-call" class="call-sheet__label">Mikrofon</label>
            <select id="mic-select-in-call" class="form-select form-select-sm"></select>
        </div>
    </div>

    <!-- GEMEINSAM: Chat. Ein Blatt, das sich ueber das Bild schiebt: auf
         breiten Schirmen an der rechten Kante, auf schmalen von unten. -->
    <div id="chat-overlay" class="call-chat-overlay" hidden>
        <div id="chat-panel" class="call-chat">
            <div class="call-chat__head">
                <span>Chat</span>
                <button id="chat-close" type="button" class="call-chat__close" aria-label="Chat schließen">&times;</button>
            </div>
            <div id="chat-area" class="call-chat__body">
                <div id="chat-log"></div>
            </div>
            <div class="call-chat__foot">
                <input id="chat-input" class="form-control" placeholder="Nachricht" autocomplete="off">
                <button id="chat-send-btn" type="button" class="btn btn-primary">Senden</button>
            </div>
        </div>
    </div>
</div>
