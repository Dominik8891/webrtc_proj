<!--
    Die Anfragenseite.

    Eingesetzt von App\Controller\RequestController::showRequestsPage() ueber
    App\Helper\ViewHelper::output(). Gefuellt und gesteuert wird sie von
    assets/js/requests.js.

    ZWEI LISTEN, WEIL EIN KONTO ZWEI SEITEN HAT
    -------------------------------------------
    Oben, was an die eigenen Standorte gerichtet ist - dort wird angenommen
    oder abgelehnt. Darunter, was man selbst angefragt hat - dort wartet man
    auf die Antwort und startet nach der Zusage die Fuehrung.

    Wer keine Standorte anbietet, sieht oben nichts als den Hinweis; die
    Ueberschrift bleibt trotzdem stehen. Ein Kasten, der je nach Rolle ganz
    verschwindet, laesst die Seite bei jedem Aufruf anders aussehen.

    JEDER KASTEN HAT EINEN RUMPF
    ----------------------------
    .app-panel traegt nur die Flaeche - Hintergrund, Rahmen, Rundung, Schatten
    (assets/css/theme.css). Den Innenabstand traegt .app-panel__body, und zwar
    als EINZIGE Stelle. Hier fehlte er: Ueberschrift, Hinweis und Liste lagen
    unmittelbar im Kasten und damit buendig an seinem Rand.

    Auffaellig war es an den Ueberschriften, aber sie waren nicht die Ursache.
    Ohne Rumpf fehlte der Abstand RINGSUM - auch die Karten sassen am Rand.
    Dass sie trotzdem eingerueckt aussahen, lag an ihrem eigenen Innenabstand
    (.req-item): Der Rahmen der Karte lag am Kastenrand, ihr Text nicht. Die
    Ueberschrift daneben hatte nichts dergleichen und stand deshalb weiter
    links als alles andere.

    Geloest wird das mit dem vorhandenen Bauteil und nicht mit einer eigenen
    Regel fuer .req-block: Eine zweite Stelle mit demselben Abstandswert waere
    genau die Sorte Doppelung, die dieses Bauteil abschaffen sollte.

    DIE ZEILEN KOMMEN AUS DEM SKRIPT und nicht vom Server. Das ist die
    Ausnahme von der Regel dieser Anwendung, und der Grund steht im
    Controller: Der Inhalt aendert sich, waehrend man hinsieht, und muss
    ohnehin im Takt nachgezogen werden. Eine zweite, serverseitige Fassung
    derselben Liste waere ein zweiter Bauort fuer dieselben Zeilen.
-->
<div class="app-page req-page" id="requests-page">

    <div class="app-toolbar">
        <div>
            <h1 class="app-page-head__title">{{t:anfrage.seite.titel}}</h1>
            <p class="app-page-head__sub">
                {{t:anfrage.seite.untertitel}}
            </p>
        </div>
        <div class="app-switch" role="group" aria-label="{{t:ansicht.label}}">
            <a class="app-switch__item" href="index.php?act=home">{{t:ansicht.karte}}</a>
            <a class="app-switch__item" href="index.php?act=show_locations_page">{{t:ansicht.liste}}</a>
            <span class="app-switch__item" aria-current="true">{{t:ansicht.anfragen}}</span>
        </div>
    </div>

    <!-- Eingehend: an die eigenen Standorte gerichtet. -->
    <section class="app-panel req-block" aria-labelledby="req-in-title">
        <div class="app-panel__body">
            <h2 class="req-block__title" id="req-in-title">{{t:anfrage.seite.eingehend}}</h2>
            <p class="req-block__hint" id="req-in-empty" hidden>{{t:anfrage.seite.eingehend_leer}}</p>
            <ul class="req-list" id="req-incoming"></ul>
        </div>
    </section>

    <!-- Ausgehend: selbst gestellt. -->
    <section class="app-panel req-block" aria-labelledby="req-out-title">
        <div class="app-panel__body">
            <h2 class="req-block__title" id="req-out-title">{{t:anfrage.seite.ausgehend}}</h2>
            <p class="req-block__hint" id="req-out-empty" hidden>{{t:anfrage.seite.ausgehend_leer}}</p>
            <ul class="req-list" id="req-outgoing"></ul>
        </div>
    </section>

    <p class="req-page__foot" id="req-error" hidden>{{t:anfrage.seite.fehler}}</p>
</div>

<!-- WORAN DAS SKRIPT DIESE SEITE ERKENNT.
     An dieser Angabe und nicht an einer id: Ein Element findet man auf jeder
     Seite, auf der jemand dieselbe id vergibt - dieselbe Ueberlegung wie bei
     der Standortseite (App\Helper\LocationView::seitendatenHtml). -->
<script>window.requestsPage = true;</script>
