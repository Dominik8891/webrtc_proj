<!--
    Benutzerliste (Werkzeugansicht).
    Gefuellt von App\Controller\UserController.

    Platzhalter:
      ###NEW###        Knopf "Neuer Benutzer" - nur mit dem Recht user.manage
      ###EMAIL###      Spaltenkopf "E-Mail" - nur fuer die Verwaltung
      ###ACTION###     Spaltenkopf "Aktionen" - nur fuer die Verwaltung
      ###USER_ROWS###  Die Zeilen aus list_user_row.html
-->
<div class="app-page">
    <div class="app-toolbar">
        <div>
            <h1 class="app-page-head__title">Benutzer</h1>
            <p class="app-page-head__sub">Anrufen lässt sich, wer gerade online ist.</p>
        </div>
        <div>###NEW###</div>
    </div>

    <div class="app-panel">
        <div class="app-table-wrap">
            <table class="table table-striped align-middle mb-0">
                <thead>
                    <tr>
                        <!-- Keine ID-Spalte mehr: Die Zahl aus der Datenbank
                             sagt niemandem etwas, der die Liste benutzt. Zum
                             Bearbeiten und Loeschen steht sie in den Verweisen
                             der Aktionsspalte. -->
                        <th>Status</th>
                        <th>Anrufen</th>
                        <th>Benutzername</th>
                        <th>Nachricht</th>
                        ###EMAIL###
                        ###ACTION###
                    </tr>
                </thead>
                <tbody>
                    ###USER_ROWS###
                </tbody>
            </table>
        </div>
    </div>
</div>
