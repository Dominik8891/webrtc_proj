<!--
    Benutzer anlegen und bearbeiten (Adminbereich).
    Gefuellt von App\Controller\UserController.

    Platzhalter:
      ###USER_INFO###  "anlegen" oder der bearbeitete Name
      ###ID###         Benutzer-ID (leer beim Anlegen)
      ###ROLE###       <option>-Liste der Rollen
      ###USERNAME###, ###EMAIL###, ###PASSWORD###
-->
<div class="app-auth">
    <div class="app-auth__card app-auth__card--wide">
        <div class="app-panel">
            <div class="app-panel__body">
                <div class="app-auth__head">
                    <h1 class="app-auth__title">Benutzer ###USER_INFO###</h1>
                </div>

                <form action="index.php?act=manage_user" method="post" enctype="multipart/form-data" autocomplete="off">
                    <input type="hidden" name="id" value="###ID###">
                    <div class="app-field">
                        <label for="role" class="form-label">Rolle</label>
                        <select id="role" name="role" class="form-select">###ROLE###</select>
                    </div>
                    <div class="app-field">
                        <label for="username" class="form-label">Benutzername</label>
                        <input type="text" id="username" name="username" class="form-control" value="###USERNAME###" autocomplete="off">
                    </div>
                    <div class="app-field">
                        <label for="email" class="form-label">E-Mail-Adresse</label>
                        <input type="email" id="email" name="email" class="form-control" value="###EMAIL###" autocomplete="off">
                    </div>
                    <div class="app-field">
                        <label for="pwd" class="form-label">Passwort</label>
                        <input type="text" id="pwd" name="pwd" class="form-control" value="###PASSWORD###" autocomplete="off">
                    </div>
                    <div class="app-actions">
                        <button type="submit" name="send" class="btn btn-primary">Speichern</button>
                        <a href="index.php?act=list_user" class="btn btn-secondary">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
