<!--
    Alle Chats des angemeldeten Benutzers.
    Gefuellt von App\Controller\ChatController.

    Platzhalter:
      ###CHAT_ROWS###  Die Zeilen aus list_chat_row.html
-->
<div class="app-page">
    <div class="app-toolbar">
        <div>
            <h1 class="app-page-head__title">{{t:chat.titel}}</h1>
            <p class="app-page-head__sub">{{t:chat.untertitel}}</p>
        </div>
    </div>

    <div class="app-panel">
        <div class="app-table-wrap">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead>
                    <tr>
                        <th>{{t:chat.spalte.status}}</th>
                        <th>{{t:chat.spalte.partner}}</th>
                        <th>{{t:chat.spalte.letzte}}</th>
                        <th>{{t:chat.spalte.verlauf}}</th>
                    </tr>
                </thead>
                <tbody>
                    ###CHAT_ROWS###
                </tbody>
            </table>
        </div>
    </div>
</div>
