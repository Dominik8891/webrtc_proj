<!--
    Passwort aendern (angemeldet). Gefuellt von App\Controller\PasswordController.

    Platzhalter:
      ###USERNAME###       Der Benutzer, dessen Passwort geaendert wird
      ###PW_CHANGE_MSG###  Meldung; leer, wenn es keine gibt.
-->
<div class="app-auth">
    <div class="app-auth__card app-auth__card--wide">
        <div class="app-panel">
            <div class="app-panel__body">
                <div class="app-auth__head">
                    <h1 class="app-auth__title">Passwort ändern</h1>
                </div>

                <form action="index.php?act=change_pw" method="post" autocomplete="off">
                    <input type="hidden" name="username" value="###USERNAME###">
                    <div class="app-field">
                        <label for="pw-old" class="form-label">Altes Passwort</label>
                        <input type="password" id="pw-old" name="pw-old" class="form-control" required>
                    </div>
                    <div class="app-field">
                        <label for="pwd1" class="form-label">Neues Passwort</label>
                        <input type="password" id="pwd1" name="pwd1" class="form-control" required>
                    </div>
                    <div class="app-field">
                        <label for="pwd2" class="form-label">Neues Passwort wiederholen</label>
                        <input type="password" id="pwd2" name="pwd2" class="form-control" required>
                    </div>
                    <div class="app-actions">
                        <button type="submit" class="btn btn-primary">Passwort ändern</button>
                        <a href="index.php?act=settings" class="btn btn-secondary">Abbrechen</a>
                    </div>
                </form>

                <div class="app-form-error">###PW_CHANGE_MSG###</div>
            </div>
        </div>
    </div>
</div>
