<!--
    Standort anbieten. Gefuellt und gesteuert von assets/js/map.js.

    Die IDs location-form, countrySelect, citySelect, latitude, longitude,
    lat, lon, osm_place, current-location, map und location-hinweis werden
    dort gebraucht - sie muessen erhalten bleiben.

    PLATZHALTER (gefuellt von App\Controller\LocationController)
    ------------------------------------------------------------
    Sie tragen die Eingaben zurueck ins Formular, wenn der Server den
    Standort abgelehnt hat (zu kurze Beschreibung, fehlende Koordinaten).
    Ohne sie stand der Nutzer nach dem Ruecksprung vor einem leeren Feld
    und musste die Beschreibung noch einmal tippen.

      ###DESCRIPTION###  die eingetippte Beschreibung
      ###LATITUDE###     Breitengrad, direkt im versteckten Feld
      ###LONGITUDE###    Laengengrad, ebenso
      ###COUNTRY_ID###   das gewaehlte Land als country.id
      ###CITY###         der gewaehlte Stadtname

    Land und Stadt stehen als data-Attribute am Formular und nicht als
    ausgewaehlte <option>: Beide Listen baut erst map.js auf - das Land aus
    index.php?act=get_country, die Stadt aus der Nominatim-Suche. Eine
    Option, die der Server hier hineinschreibt, wuerde davon ueberschrieben.
    Bei einem leeren Formular bleiben alle fuenf Platzhalter leer.
-->
<div class="app-page app-page--narrow" style="max-width: 720px;">
    <div class="app-toolbar">
        <div>
            <h1 class="app-page-head__title">Standort anbieten</h1>
            <p class="app-page-head__sub">
                Der Ort, an dem Sie führen. Er erscheint auf der Karte – hervorgehoben, sobald Sie online sind.
            </p>
        </div>
    </div>

    <div class="app-panel">
        <div class="app-panel__body">

            <!-- Bereich für Fehlermeldungen der Länder-/Städteauswahl.
                 Wird von assets/js/map.js befüllt (zeigeHinweis) und bleibt
                 leer und unsichtbar, solange alles funktioniert. -->
            <div id="location-hinweis" class="alert alert-danger" style="display:none;" role="alert"></div>

            <form id="location-form" action="index.php?act=set_location" method="post"
                  autocomplete="off"
                  data-vorher-land="###COUNTRY_ID###"
                  data-vorher-stadt="###CITY###">
                <div class="app-field">
                    <label for="countrySelect" class="form-label">Land</label>
                    <select id="countrySelect" name="country" class="form-select" required>
                        <option value="">Land wählen...</option>
                        <!-- Optionen werden per JS eingefügt -->
                    </select>
                </div>

                <div class="app-field">
                    <label for="citySelect" class="form-label">Stadt</label>
                    <select id="citySelect" name="city" class="form-select" required>
                        <option value="">Stadt wählen...</option>
                    </select>
                </div>

                <div class="app-field">
                    <label for="description" class="form-label">Beschreibung</label>
                    <input type="text" id="description" name="description" class="form-control"
                           placeholder="Was gibt es dort zu sehen?"
                           value="###DESCRIPTION###" required>
                </div>

                <!-- Hier stand an beiden Feldern ein "required". Es hatte KEINE
                     Wirkung: Ein <input type="hidden"> ist von der Pruefung des
                     Browsers ausgenommen (HTML-Standard, "barred from constraint
                     validation"). Das Formular ging also ohne Koordinaten raus,
                     und erst der Server wies es ab - eine Seite spaeter und ohne
                     Bezug zum Feld, an dem es lag.

                     Geprueft wird jetzt beim Abschicken in map.js
                     (pruefeVorDemAbschicken). Verbindlich bleibt die Pruefung im
                     LocationController: Wer ohne JavaScript abschickt, kommt an
                     der Pruefung des Browsers ohnehin vorbei. -->
                <input type="hidden" id="latitude"  name="latitude"  value="###LATITUDE###">
                <input type="hidden" id="longitude" name="longitude" value="###LONGITUDE###">
                <input type="hidden" name="country-iso2" id="country-iso2">

                <div class="app-field">
                    <label class="form-label" for="map">Punkt auf der Karte</label>
                    <div id="map" class="app-picker-map"></div>
                    <div class="app-actions" style="margin-top: var(--app-space-2);">
                        <button id="current-location" type="button" class="btn btn-secondary btn-sm">
                            Aktuellen Standort verwenden
                        </button>
                    </div>
                </div>

                <dl class="app-details app-text-sm">
                    <dt>Breitengrad</dt><dd><span id="lat" class="app-mono">–</span></dd>
                    <dt>Längengrad</dt><dd><span id="lon" class="app-mono">–</span></dd>
                    <dt>Ort laut OpenStreetMap</dt><dd><span id="osm_place">–</span></dd>
                </dl>

                <div class="app-actions">
                    <button type="submit" class="btn btn-primary">Standort speichern</button>
                    <a href="index.php?act=settings" class="btn btn-secondary">Abbrechen</a>
                </div>
            </form>
        </div>
    </div>
</div>
