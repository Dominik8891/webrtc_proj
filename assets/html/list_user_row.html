<!--
    Eine Zeile der Benutzerliste. Gefuellt von
    App\Controller\UserController::generateUserRows().

    ###EMAIL### und ###ACTION### liefern die VOLLSTAENDIGE Zelle samt <td>
    oder einen Leerstring - sie erscheinen nur fuer die Verwaltung. Stuende
    hier ein festes <td> um den Platzhalter, haette die Zeile fuer alle
    anderen Rollen eine leere Zelle mehr als der Kopf, und die Tabelle waere
    um eine Spalte verschoben.
-->
<tr>
    <td>###STATUS###</td>
    <td>###CALL###</td>
    <td>###USERNAME###</td>
    <td>###MESSAGE###</td>
    ###EMAIL###
    ###ACTION###
</tr>
