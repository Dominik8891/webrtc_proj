<!--
    Der Dialog fuer einen eingehenden Anruf.

    Eingeblendet von assets/js/signaling.js, sobald ein Offer eintrifft; die
    Knoepfe haengen in assets/js/main.js.

    Die IDs calling_user, media-video-checkbox, media-audio-checkbox,
    camera-select, mic-select, media-accept-btn und media-decline-btn werden
    dort gebraucht - sie muessen erhalten bleiben.

    Die Geraetewahl steht schon hier und nicht erst im Call: Wer annimmt,
    entscheidet damit zugleich, womit er teilnimmt.
-->
<div id="media-select-dialog" style="display:none;" role="dialog" aria-modal="true">
  <div class="call-invite">

    <div class="call-invite__head">
      <p class="call-invite__eyebrow">Eingehender Anruf</p>
      <h2 class="call-invite__name" id="calling_user"></h2>
    </div>

    <div class="app-field">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="media-video-checkbox" checked>
        <label class="form-check-label" for="media-video-checkbox">Video senden</label>
      </div>
      <select id="camera-select" class="form-select form-select-sm" style="margin-top: var(--app-space-2);"></select>
    </div>

    <div class="app-field">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="media-audio-checkbox" checked>
        <label class="form-check-label" for="media-audio-checkbox">Ton senden</label>
      </div>
      <select id="mic-select" class="form-select form-select-sm" style="margin-top: var(--app-space-2);"></select>
    </div>

    <div class="app-actions app-actions--stretch">
      <button id="media-accept-btn" type="button" class="btn btn-success">Annehmen</button>
      <button id="media-decline-btn" type="button" class="btn btn-secondary">Ablehnen</button>
    </div>
  </div>
</div>
