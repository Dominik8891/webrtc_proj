<!--
    Standortabfrage nach dem Login.

    Wird nur noch Guides gezeigt: Wer Standorte anbietet, ist selbst der
    Fundort - für einen Zuschauer ist die eigene Position ohne Bedeutung, er
    sucht sich einen Standort auf der Karte aus. Wer gefragt wird, entscheidet
    das Recht user.position (LoginController::continueAfterLogin), dieselbe
    Angabe, über die index.php auch die Route save_location absichert.
-->
<div class="app-auth">
    <div class="app-auth__card">
        <div class="app-panel">
            <div class="app-panel__body">
                <div class="app-auth__head">
                    <h1 class="app-auth__title">Ihren aktuellen Standort angeben?</h1>
                    <p class="app-auth__sub">
                        Als Guide hilft das dabei, Sie in der Nähe suchenden Zuschauern
                        zuzuordnen. Die Angabe ist freiwillig.
                    </p>
                </div>
                <div class="app-actions app-actions--stretch">
                    <button onclick="askLocation()" class="btn btn-primary">Ja, Standort teilen</button>
                    <button onclick="window.location.href='index.php'" class="btn btn-secondary">Nein, danke</button>
                </div>
            </div>
        </div>
    </div>
</div>
