<!--
    Standortabfrage nach dem Login.

    Wird nur noch Guides gezeigt: Wer Standorte anbietet, ist selbst der
    Fundort - für einen Zuschauer ist die eigene Position ohne Bedeutung, er
    sucht sich einen Standort auf der Karte aus. Wer gefragt wird, entscheidet
    das Recht user.position (LoginController::continueAfterLogin), dieselbe
    Angabe, über die index.php auch die Route save_location absichert.
-->
<div class="container d-flex justify-content-center align-items-center">
    <div class="card shadow-sm p-4 text-center" style="max-width: 420px;">
        <h3 class="mb-3">Möchtest du deinen aktuellen Standort angeben?</h3>
        <p class="text-muted small">
            Als Guide hilft das dabei, dich in der Nähe suchenden Zuschauern
            zuzuordnen. Die Angabe ist freiwillig, und du kannst sie hier auch
            ablehnen.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <button onclick="askLocation()" class="btn btn-success">Ja</button>
            <button onclick="window.location.href='index.php'" class="btn btn-outline-secondary">Nein</button>
        </div>
    </div>
</div>
