<!--
    Die Standortuebersicht als Tabelle - die Alternative zur Karte auf der
    Startseite. Gefuellt von assets/js/locations_table.js.

    Die id locationsTable und die Spaltenzahl gehoeren zusammen: Das Modul

<div class="app-page">
    <div class="app-toolbar">
        <div>
            <h1 class="app-page-head__title">Alle Standorte</h1>

        </div>
    </div>

    <div class="app-panel">
        <div class="app-table-wrap">
            <table class="table table-striped align-middle" id="locationsTable" tabindex="-1">

                    <tr>

                        <th>Status</th>

                        <th>Land</th>
                        <th>Stadt</th>

                </thead>
                <tbody>

                </tbody>

    </div>
</div>
